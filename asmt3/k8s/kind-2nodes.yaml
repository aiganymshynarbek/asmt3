# Local test cluster with 2 worker nodes so the 2 Registration replicas
# land on different nodes (topologySpreadConstraints).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aitu-a3
nodes:
  - role: control-plane
  - role: worker
    labels: {topology.kubernetes.io/zone: zone-a}
  - role: worker
    labels: {topology.kubernetes.io/zone: zone-b}
